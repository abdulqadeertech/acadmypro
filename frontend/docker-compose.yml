version: "3.9"
services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      JWT_SECRET: change-this-in-production
      CLIENT_URL: http://localhost:5173
    volumes:
      - ./backend/data:/app/data
      - ./backend/backups:/app/backups
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
